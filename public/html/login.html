<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>iKolekta - Login</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Custom Theme CSS -->
    <link href="/css/theme.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #f8f9fa; }
        .modal-backdrop-blur {
            background-color: rgba(33, 37, 41, 0.6);
            backdrop-filter: blur(4px);
            -webkit-backdrop-filter: blur(4px);
        }
        .rounded-4 { border-radius: 1rem !important; }
        .rounded-5 { border-radius: 1.5rem !important; }
    </style>
</head>
<body class="text-dark">
    <div class="container-fluid vh-100 d-flex flex-column justify-content-center align-items-center px-4">
        <h1 class="fs-1 fw-bold text-primary mb-2">iKolekta</h1>
        <p class="text-secondary mb-5 text-center">Please login to access the Dashboard</p>
        
        <div class="w-100 d-flex flex-column gap-3" style="max-width: 400px;">
            <button onclick="openLogin('rep')" class="btn btn-primary fw-bold py-3 rounded-4 shadow-sm d-flex justify-content-center align-items-center gap-2 w-100">
                <i data-lucide="user" style="width: 20px; height: 20px;"></i>
                Sign In as Representative
            </button>
            <button onclick="openLogin('admin')" class="btn btn-dark fw-bold py-3 rounded-4 shadow-sm d-flex justify-content-center align-items-center gap-2 w-100">
                <i data-lucide="shield" style="width: 20px; height: 20px;"></i>
                Sign In as Admin
            </button>
        </div>
    </div>

    <!-- Login Modal Container (Custom) -->
    <div id="login-modal" class="position-fixed top-0 start-0 w-100 h-100 z-3 d-none flex-column justify-content-center align-items-center modal-backdrop-blur px-3">
        <form id="login-form" class="bg-white w-100 rounded-5 p-4 p-md-5 shadow-lg d-flex flex-column position-relative" style="max-width: 400px;" onsubmit="handleLogin(event)">
            <button type="button" onclick="closeLogin()" class="btn btn-light position-absolute top-0 end-0 m-3 rounded-circle d-flex justify-content-center align-items-center p-2" style="width: 35px; height: 35px;">
                <i data-lucide="x" style="width: 16px; height: 16px;"></i>
            </button>
            <h3 id="modal-title" class="fs-4 fw-bold text-dark mb-4 mt-2 text-center">Sign In</h3>
            
            <div class="d-flex flex-column gap-3">
                <div>
                    <label class="form-label text-secondary fw-bold text-uppercase" style="font-size: 11px; letter-spacing: 1px;">Username</label>
                    <input type="text" id="username" placeholder="@username" class="form-control form-control-lg bg-light border-0 rounded-4 px-3 py-3 fs-6 fw-medium text-dark">
                    <div id="username-error" class="invalid-feedback fw-medium" style="font-size: 11px; margin-left: 4px;"></div>
                </div>
                <div>
                    <label class="form-label text-secondary fw-bold text-uppercase" style="font-size: 11px; letter-spacing: 1px;">Password</label>
                    <input type="password" id="password" placeholder="••••••••" class="form-control form-control-lg bg-light border-0 rounded-4 px-3 py-3 fs-6 fw-medium text-dark">
                    <div id="password-error" class="invalid-feedback fw-medium" style="font-size: 11px; margin-left: 4px;"></div>
                </div>
            </div>
            
            <button type="submit" class="btn btn-primary mt-4 w-100 fw-bold py-3 rounded-4 shadow-sm">
                Login
            </button>
        </form>
    </div>

    <!-- Bootstrap JS Bundle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        lucide.createIcons();
        let targetRole = '';

        function openLogin(role) {
            targetRole = role;
            document.getElementById('modal-title').textContent = role === 'admin' ? 'Admin Login' : 'Representative Login';
            document.getElementById('login-modal').classList.remove('d-none');
            document.getElementById('login-modal').classList.add('d-flex');
            document.getElementById('username').focus();
        }

        document.addEventListener('DOMContentLoaded', () => {
            const usernameInput = document.getElementById('username');
            usernameInput.addEventListener('keydown', (e) => {
                if (e.key === 'Enter') {
                    e.preventDefault(); // Prevent form submission
                    document.getElementById('password').focus();
                }
            });
        });

        function resetErrors() {
            const usernameInput = document.getElementById('username');
            const passwordInput = document.getElementById('password');
            
            usernameInput.classList.remove('is-invalid');
            passwordInput.classList.remove('is-invalid');
        }

        function closeLogin() {
            document.getElementById('login-modal').classList.add('d-none');
            document.getElementById('login-modal').classList.remove('d-flex');
            document.getElementById('login-form').reset();
            resetErrors();
        }

        function handleLogin(e) {
            e.preventDefault();
            resetErrors();
            
            const usernameInput = document.getElementById('username');
            const passwordInput = document.getElementById('password');
            const usernameError = document.getElementById('username-error');
            const passwordError = document.getElementById('password-error');
            
            let isValid = true;
            
            if (!usernameInput.value.trim()) {
                usernameInput.classList.add('is-invalid');
                usernameError.textContent = 'Username is required.';
                isValid = false;
            } else if (!usernameInput.value.trim().startsWith('@')) {
                usernameInput.classList.add('is-invalid');
                usernameError.textContent = 'Username must start with @.';
                isValid = false;
            }
            
            if (!passwordInput.value) {
                passwordInput.classList.add('is-invalid');
                passwordError.textContent = 'Password is required.';
                isValid = false;
            } else if (passwordInput.value.length < 6) {
                passwordInput.classList.add('is-invalid');
                passwordError.textContent = 'Password must be at least 6 characters.';
                isValid = false;
            }
            
            if (isValid) {
                localStorage.setItem('kolekta_user', usernameInput.value.trim());
                window.location.href = targetRole === 'admin' ? '/admin' : '/rep';
            }
        }
    </script>
</body>
</html>
