<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>iKolekta - Login</title>
    <link href="/css/styles.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #e2e8f0; }
    </style>
</head>
<body class="text-slate-800 antialiased">
    <div class="app-container bg-[#f8fafc] w-full min-h-screen flex flex-col justify-center items-center px-6">
        <h1 class="text-3xl font-bold text-indigo-600 mb-2">iKolekta</h1>
        <p class="text-slate-500 mb-8 text-center">Please login to access the Dashboard</p>
        
        <div class="w-full max-w-sm flex flex-col gap-4">
            <button onclick="openLogin('rep')" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-4 rounded-xl transition-all shadow-sm text-center flex justify-center items-center gap-2">
                <i data-lucide="user" class="w-5 h-5"></i>
                Sign In as Representative
            </button>
            <button onclick="openLogin('admin')" class="w-full bg-slate-900 hover:bg-slate-800 text-white font-bold py-4 rounded-xl transition-all shadow-sm text-center flex justify-center items-center gap-2">
                <i data-lucide="shield" class="w-5 h-5"></i>
                Sign In as Admin
            </button>
        </div>
    </div>

    <!-- Login Modal Container -->
    <div id="login-modal" class="fixed inset-0 z-50 hidden flex-col justify-center items-center bg-slate-900/60 backdrop-blur-sm px-4">
        <form id="login-form" class="bg-white w-full max-w-sm rounded-3xl p-6 shadow-2xl flex flex-col relative" onsubmit="handleLogin(event)">
            <button type="button" onclick="closeLogin()" class="absolute top-4 right-4 w-8 h-8 flex items-center justify-center bg-slate-100 text-slate-500 rounded-full hover:bg-slate-200 transition-colors">
                <i data-lucide="x" class="w-4 h-4"></i>
            </button>
            <h3 id="modal-title" class="text-xl font-bold text-slate-900 mb-6 mt-2 text-center">Sign In</h3>
            
            <div class="space-y-4">
                <div>
                    <label class="block text-[11px] font-bold text-slate-500 uppercase tracking-widest mb-2">Username</label>
                    <input type="text" id="username" required placeholder="@username" class="w-full bg-slate-50 border border-slate-200 rounded-2xl px-4 py-3.5 focus:bg-white focus:ring-2 focus:ring-indigo-500 outline-none transition-all font-medium text-slate-900">
                </div>
                <div>
                    <label class="block text-[11px] font-bold text-slate-500 uppercase tracking-widest mb-2">Password</label>
                    <input type="password" id="password" required placeholder="••••••••" class="w-full bg-slate-50 border border-slate-200 rounded-2xl px-4 py-3.5 focus:bg-white focus:ring-2 focus:ring-indigo-500 outline-none transition-all font-medium text-slate-900">
                </div>
            </div>
            
            <button type="submit" class="mt-6 w-full bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-4 rounded-2xl shadow-lg shadow-indigo-600/30 transition-transform active:scale-[0.98]">
                Login
            </button>
        </form>
    </div>

    <script>
        lucide.createIcons();
        let targetRole = '';

        function openLogin(role) {
            targetRole = role;
            document.getElementById('modal-title').textContent = role === 'admin' ? 'Admin Login' : 'Representative Login';
            document.getElementById('login-modal').classList.remove('hidden');
            document.getElementById('login-modal').classList.add('flex');
            document.getElementById('username').focus();
        }

        function closeLogin() {
            document.getElementById('login-modal').classList.add('hidden');
            document.getElementById('login-modal').classList.remove('flex');
            document.getElementById('login-form').reset();
        }

        function handleLogin(e) {
            e.preventDefault();
            const username = document.getElementById('username').value;
            localStorage.setItem('kolekta_user', username);
            window.location.href = targetRole === 'admin' ? '/admin' : '/rep';
        }
    </script>
</html>
