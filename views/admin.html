<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>iKolekta - System Admin</title>
    
    <!-- Tailwind CSS -->
    <link href="/css/styles.css" rel="stylesheet">
    
    <!-- Fonts & Icons -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #e2e8f0;
            -webkit-tap-highlight-color: transparent;
            overscroll-behavior-y: none;
        }

        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

        .glass-header {
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border-bottom: 1px solid rgba(0, 0, 0, 0.05);
        }

        .glass-nav {
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border-top: 1px solid rgba(0, 0, 0, 0.05);
        }

        /* Animations */
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        @keyframes slideUp { from { opacity: 0; transform: translateY(100%); } to { opacity: 1; transform: translateY(0); } }
        @keyframes slideDown { from { opacity: 1; transform: translateY(0); } to { opacity: 0; transform: translateY(100%); } }
        
        .animate-fade-in { animation: fadeIn 0.3s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
        .animate-slide-up { animation: slideUp 0.4s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
        .animate-slide-down { animation: slideDown 0.3s cubic-bezier(0.16, 1, 0.3, 1) forwards; }

        .nav-btn.active { color: #4f46e5; }
        .nav-btn.active i { transform: translateY(-2px); }
    </style>
</head>
<body class="text-slate-800 antialiased selection:bg-indigo-100 selection:text-indigo-900">

    <div class="app-container relative bg-[#f8fafc] w-full min-h-screen flex flex-col items-center" id="app-root">
        
        <!-- Header -->
        <header class="glass-header sticky top-0 z-30 px-6 py-4 flex justify-between items-center w-full max-w-7xl">
            <div class="flex items-center gap-3">
                <div class="w-9 h-9 rounded-xl bg-indigo-600 flex items-center justify-center text-white shadow-md shadow-indigo-200">
                    <i data-lucide="shield" class="w-5 h-5"></i>
                </div>
                <h1 class="text-xl font-bold tracking-tight text-slate-900">iKolekta Admin</h1>
            </div>
            
            <!-- Desktop Top Nav -->
            <nav class="hidden md:flex items-center gap-8 ml-auto mr-8">
                <button onclick="app.switchTab('home')" data-tab="home" class="nav-btn active flex items-center gap-2 text-slate-500 font-semibold hover:text-indigo-600 transition-colors">
                    <i data-lucide="layout-dashboard" class="w-5 h-5 transition-transform"></i> Dashboard
                </button>
                <button onclick="app.switchTab('history')" data-tab="history" class="nav-btn flex items-center gap-2 text-slate-500 font-semibold hover:text-indigo-600 transition-colors">
                    <i data-lucide="list-collapse" class="w-5 h-5 transition-transform"></i> Audit Log
                </button>
            </nav>

            <a href="/login" class="hidden md:flex items-center gap-2 px-5 py-2.5 rounded-full bg-slate-50 border border-slate-200 text-slate-600 font-bold hover:bg-red-50 hover:border-red-200 hover:text-red-600 transition-colors text-sm">
                <i data-lucide="log-out" class="w-4 h-4"></i>
                Log Out
            </a>
        </header>

        <!-- Dynamic Content Injected Here -->
        <main class="flex-1 p-5 md:p-8 relative overflow-y-auto no-scrollbar pb-24 w-full max-w-7xl" id="main-content"></main>

        <!-- Bottom Navigation (Mobile Only) -->
        <div class="fixed bottom-0 w-full flex justify-center z-30 pb-safe pointer-events-none md:hidden">
            <nav id="bottom-nav" class="glass-nav w-full px-6 py-4 flex justify-around items-center border-t pointer-events-auto shadow-[0_-10px_40px_rgba(0,0,0,0.05)]">
            <button onclick="app.switchTab('home')" data-tab="home" class="nav-btn active flex flex-col items-center gap-1 text-slate-400 transition-colors">
                <i data-lucide="layout-dashboard" class="w-6 h-6 transition-transform"></i>
                <span class="text-[10px] font-semibold mt-0.5">Dashboard</span>
            </button>
            <button onclick="app.switchTab('history')" data-tab="history" class="nav-btn flex flex-col items-center gap-1 text-slate-400 hover:text-indigo-600 transition-colors">
                <i data-lucide="list-collapse" class="w-6 h-6 transition-transform"></i>
                <span class="text-[10px] font-medium mt-0.5">Audit Log</span>
            </button>
            <a href="/login" class="nav-btn flex flex-col items-center gap-1 text-slate-400 hover:text-red-600 transition-colors">
                <i data-lucide="log-out" class="w-6 h-6 transition-transform"></i>
                <span class="text-[10px] font-medium mt-0.5">Log Out</span>
            </a>
        </nav>
        </div>

    </div>

    <!-- The Admin SPA Logic -->
    <script src="/js/admin.js"></script>
</body>
</html>
