<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>iKolekta - Class Representative</title>
    
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Custom Theme CSS -->
    <link href="/css/theme.css" rel="stylesheet">
    
    <!-- Fonts & Icons -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f8f9fa;
            -webkit-tap-highlight-color: transparent;
            overscroll-behavior-y: none;
        }
        
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

        .glass-header {
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border-bottom: 1px solid rgba(0, 0, 0, 0.05);
        }

        .glass-nav {
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border-top: 1px solid rgba(0, 0, 0, 0.05);
        }

        /* Animations */
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        @keyframes slideUp { from { opacity: 0; transform: translateY(100%); } to { opacity: 1; transform: translateY(0); } }
        @keyframes slideDown { from { opacity: 1; transform: translateY(0); } to { opacity: 0; transform: translateY(100%); } }
        
        .animate-fade-in { animation: fadeIn 0.3s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
        .animate-slide-up { animation: slideUp 0.4s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
        .animate-slide-down { animation: slideDown 0.3s cubic-bezier(0.16, 1, 0.3, 1) forwards; }

        .nav-btn {
            background: transparent;
            border: none;
            text-decoration: none;
            cursor: pointer;
        }

        .nav-btn.active { color: #0d6efd !important; }
        .nav-btn.active i { transform: translateY(-2px); }
        .rounded-4 { border-radius: 1rem !important; }
        .rounded-5 { border-radius: 1.5rem !important; }
        .pb-safe { padding-bottom: calc(1rem + env(safe-area-inset-bottom)); }
        
        /* Modals and Overlays custom styles */
        .modal-backdrop-blur {
            background-color: rgba(33, 37, 41, 0.6);
            backdrop-filter: blur(4px);
            -webkit-backdrop-filter: blur(4px);
        }
    </style>
</head>
<body class="text-dark">

    <div class="position-relative bg-light w-100 vh-100 d-flex flex-column align-items-center" id="app-root">
        
        <!-- Header -->
        <header class="glass-header sticky-top w-100 px-4 py-3 d-flex justify-content-between align-items-center z-3" style="max-width: 1200px;">
            <div class="d-flex align-items-center gap-2">
                <div class="bg-primary text-white d-flex align-items-center justify-content-center shadow-sm" style="width: 36px; height: 36px; border-radius: 10px;">
                    <i data-lucide="wallet" style="width: 20px; height: 20px;"></i>
                </div>
                <h1 class="fs-5 fw-bold text-dark m-0">iKolekta</h1>
            </div>
            
            <!-- Desktop Top Nav -->
            <nav class="d-none d-md-flex align-items-center gap-4 ms-auto me-4">
                <button onclick="app.switchTab('home')" data-tab="home" class="nav-btn active d-flex align-items-center gap-2 text-secondary fw-semibold transition-colors">
                    <i data-lucide="home" style="width: 20px; height: 20px;"></i> Home
                </button>
                <button onclick="app.switchTab('history')" data-tab="history" class="nav-btn d-flex align-items-center gap-2 text-secondary fw-semibold transition-colors">
                    <i data-lucide="clock" style="width: 20px; height: 20px;"></i> History
                </button>
            </nav>

            <a href="/login" class="d-none d-md-flex align-items-center gap-2 px-3 py-2 rounded-pill bg-white border text-secondary fw-bold text-decoration-none border-secondary-subtle">
                <i data-lucide="log-out" style="width: 16px; height: 16px;"></i>
                Log Out
            </a>
        </header>

        <!-- Dynamic Content Injected Here -->
        <main class="flex-grow-1 p-3 p-md-4 position-relative overflow-y-auto no-scrollbar pb-5 w-100" style="max-width: 1200px; padding-bottom: 6rem !important;" id="main-content"></main>

        <!-- Bottom Navigation (Mobile Only) -->
        <div class="position-fixed bottom-0 w-100 d-flex justify-content-center z-3 pb-safe d-md-none pointer-events-none">
            <nav id="bottom-nav" class="glass-nav w-100 px-4 py-3 d-flex justify-content-around align-items-center border-top shadow pointer-events-auto" style="pointer-events: auto;">
                <button onclick="app.switchTab('home')" data-tab="home" class="nav-btn active d-flex flex-column align-items-center text-secondary transition-colors">
                    <i data-lucide="home" style="width: 24px; height: 24px; transition: transform 0.2s;"></i>
                    <span class="fw-semibold mt-1" style="font-size: 10px;">Home</span>
                </button>
                <button onclick="app.switchTab('history')" data-tab="history" class="nav-btn d-flex flex-column align-items-center text-secondary transition-colors">
                    <i data-lucide="clock" style="width: 24px; height: 24px; transition: transform 0.2s;"></i>
                    <span class="fw-medium mt-1" style="font-size: 10px;">History</span>
                </button>
                <a href="/login" class="nav-btn d-flex flex-column align-items-center text-secondary text-decoration-none transition-colors">
                    <i data-lucide="log-out" style="width: 24px; height: 24px; transition: transform 0.2s;"></i>
                    <span class="fw-medium mt-1" style="font-size: 10px;">Log Out</span>
                </a>
            </nav>
        </div>

    </div>

    <!-- Bootstrap JS Bundle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <!-- The Rep SPA Logic -->
    <script src="/js/rep.js"></script>
</body>
</html>
